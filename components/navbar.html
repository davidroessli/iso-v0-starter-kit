<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISO top navigation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/davidroessli/iso-v0-starter-kit@main/css/bootstrap-iso.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/davidroessli/iso-v0-starter-kit@main/css/iso.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<!--
  TOP NAVIGATION

  The ISO page header has two parts, in this order:
  1. Utility bar (.nav-utility): dark strip with account links and the
     language menu. Optional on small sites.
  2. Main navigation (.navbar.nav-iso inside <header>): white bar with the red
     ISO logo, the main links and the search box.

  - Copy the whole block and change only the links and labels.
  - The logo is an empty link with the classes "logo isologo logo-sm"; the
    image comes from the stylesheet. Don't replace it with an <img>.
  - Mark the current page with .active on the <li> and aria-current="page"
    on its link.
  - Below 1200px (ISO "lg") the links fold into the "Menu" button. That needs
    Bootstrap's JavaScript (script tag at the end of this file).
  - Keep the order of the elements: logo, menu button, links, search. The
    stylesheet places them.
  - Keep each id (navbarMain, lang-dropdown…) unique on the page.

  Not included: Wood's mega menu (large drop-down panels) and the shopping
  cart button.
-->

<!-- 1. Full ISO header: utility bar + main navigation -->
<nav class="nav-utility navbar-expand-lg text-sm navbar-dark bg-darkergray text-light sticky-top" aria-label="Utility navigation">
  <div class="container">
    <ul class="nav d-flex justify-content-between justify-content-sm-around justify-content-md-end">
      <li class="nav-item">
        <a href="#" class="nav-link d-flex align-items-center"><i class="bi bi-person-circle" aria-hidden="true"></i>&nbsp;Login</a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link d-flex align-items-center"><i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>&nbsp;Portal</a>
      </li>
      <li class="nav-item dropdown">
        <a href="#" id="lang-dropdown" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">English</a>
        <ul class="dropdown-menu" aria-labelledby="lang-dropdown">
          <li><a class="dropdown-item" href="#" lang="fr">Français</a></li>
          <li><a class="dropdown-item" href="#" lang="ru">Русский</a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>

<header class="sticky-top">
  <nav class="navbar nav-iso navbar-expand-lg navbar-light bg-white text-dark shadow-md" aria-label="Main navigation">
    <div class="container">
      <a class="logo isologo logo-sm" href="#" title="ISO home page" aria-label="ISO home page"></a>
      <button class="btn btn-light navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon-animated"><span></span><span></span><span></span><span></span></span><span class="visually-hidden-xs">&nbsp;Menu</span>
      </button>
      <div class="collapse navbar-collapse flex-lg-grow-0 flex-xl-grow-1" id="navbarMain">
        <ul class="navbar-nav me-auto mb-lg-0 ps-2 pe-2">
          <li class="nav-item active"><a href="#" class="nav-link" aria-current="page">Standards</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Sectors</a></li>
          <li class="nav-item"><a href="#" class="nav-link">About ISO</a></li>
          <li class="nav-item"><a href="#" class="nav-link">News</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Taking part</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Store</a></li>
        </ul>
      </div>
      <form class="navbar-form isosearch d-flex flex-lg-grow-1" role="search">
        <div class="input-group">
          <input type="search" class="form-control" placeholder="Search" aria-label="Search" aria-describedby="button-search">
          <button class="btn btn-light" type="submit" id="button-search"><i class="bi bi-search" aria-hidden="true"></i><span class="visually-hidden"> Search</span></button>
        </div>
      </form>
    </div>
  </nav>
</header>

<main class="container">
  <section>
    <h1>Page title</h1>
    <p class="lead">The page content starts here.</p>
  </section>
</main>

<!--
  2. Small site: logo, site name and a few links, no utility bar or search.
     The ISO logo links to iso.org; the site name next to it (.navbar-brand
     with .order-1, so it stays after the logo) links to the site's home page.
     To check with design: Wood has no pattern for a site name in the navbar.
-->
<header>
  <nav class="navbar nav-iso navbar-expand-lg navbar-light bg-white text-dark shadow-md" aria-label="Site navigation">
    <div class="container">
      <a class="logo isologo logo-sm" href="https://www.iso.org" title="ISO home page" aria-label="ISO home page"></a>
      <a class="navbar-brand order-1 ms-3 me-auto" href="#">ISO Companion<small class="d-block text-muted text-xs">Your guide to ISO standards</small></a>
      <button class="btn btn-light navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSite" aria-controls="navbarSite" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon-animated"><span></span><span></span><span></span><span></span></span><span class="visually-hidden-xs">&nbsp;Menu</span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarSite">
        <ul class="navbar-nav mb-lg-0 ps-2 pe-2">
          <li class="nav-item active"><a href="#" class="nav-link" aria-current="page">Overview</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Benefits</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Give feedback</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
